name: release-gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Prepare release-gate vault fixture
        run: |
          mkdir -p .github-ci-vault/.obsidian/plugins/obsidian-companion
          cat > .github-ci-vault/Welcome.md <<'EOF'
          Welcome
          EOF
          cat > .github-ci-vault/.obsidian/plugins/obsidian-companion/data.json <<'EOF'
          {
            "provider": "openrouter",
            "provider_settings": {
              "openrouter": {
                "settings": "{\"api_key\":\"\",\"provider\":\"openrouter\",\"models\":{},\"model\":\"\"}",
                "models": {}
              }
            }
          }
          EOF

      - name: Run production release gate
        env:
          RELEASE_CHECK_SKIP_SMOKE: 1
          OBSIDIAN_VAULT_PATHS: "${{ github.workspace }}/.github-ci-vault"
        run: npm run release:check -- --vaults "$OBSIDIAN_VAULT_PATHS"

      - name: Upload release-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.sha }}
          path: artifacts/production-gate-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload copy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copy-plugin-${{ github.sha }}
          path: artifacts/copy-plugin-*.json
          if-no-files-found: ignore
          retention-days: 14
